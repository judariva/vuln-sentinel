id: positive-e5-poc-lines
category: positive
description: >
  E5: el agente lee el PoC como texto y cita las líneas que implementan el impacto de la CVE
  (rce). Las líneas se verifican y la IA lleva el nivel de C a B. Una segunda afirmación cita
  líneas equivocadas y se descarta.
candidate:
  cve_id: CVE-2099-0013
  level: C
  impact_class: rce
  seed_urls:
    - https://raw.githubusercontent.com/example-org/CVE-2099-0013/main/poc.py
pages:
  https://raw.githubusercontent.com/example-org/CVE-2099-0013/main/poc.py: |
    # Synthetic PoC written for the vuln-sentinel evaluation set. Not a real exploit.
    import socket

    def build_request(host: bytes) -> bytes:
        # Overlong header overflows the 4096-byte buffer in parse_header() (CWE-787)
        payload = b"A" * 8192
        return b"GET / HTTP/1.1\r\nHost: " + host + b"\r\nX-Long: " + payload + b"\r\n\r\n"
script:
  - tool_calls:
      - {name: fetch_url, input: {url: "https://raw.githubusercontent.com/example-org/CVE-2099-0013/main/poc.py"}}
  - submit:
      cve_id: CVE-2099-0013
      proposed_level: B
      impact_class: rce
      claims:
        - kind: exploit_impact
          statement: The PoC sends an overlong header that overflows the parser buffer.
          citations:
            - url: https://raw.githubusercontent.com/example-org/CVE-2099-0013/main/poc.py
              quote: Overlong header overflows the 4096-byte buffer in parse_header()
              line_start: 5
              line_end: 6
        - kind: exploit_impact
          statement: Same, with wrong lines.
          citations:
            - url: https://raw.githubusercontent.com/example-org/CVE-2099-0013/main/poc.py
              quote: payload = b"A" * 8192
              line_start: 1
              line_end: 2
      summary: The PoC implements the heap overflow described in the CVE.
expect:
  status: ok
  final_level: B
  accepted_claims: 1
  rejected_claims: 1
