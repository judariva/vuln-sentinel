# Arquitectura de vuln-sentinel como datos (D12).
# Reglas:
#   - Los IDs son estables y NUNCA se reutilizan. Un elemento retirado se marca `status: retired`.
#   - Las vistas (views/*.md) y los ADR solo referencian IDs de este fichero; un test lo comprueba.
#   - Sin nombres de recursos internos, IDs de tenant/suscripción ni IP (regla 8): los nombres de
#     servicio son los del producto de Azure/Cloudflare.
schema_version: 1
id_prefixes:
  CMP: componente
  FLW: flujo
  TB: frontera de confianza
  CTL: control
  THR: amenaza
  SRC: fuente externa

components:
  - id: CMP-001
    name: front
    service: Cloudflare Workers static assets. SPA en web/ (Vite + React + shadcn/ui, ADR-0023); consume la API pública como cualquier cliente
    status: planned
  - id: CMP-002
    name: api
    service: Azure Container Apps (app). FastAPI de solo lectura (src/vs/api/); /admin/* solo con el JWT de Access (esqueleto)
    status: planned
  - id: CMP-003
    name: job-ingest
    service: Azure Container Apps Jobs (cron */5)
    status: planned
  - id: CMP-004
    name: job-investigate
    service: Azure Container Apps Jobs (cron */10)
    status: planned
  - id: CMP-005
    name: job-publish
    service: Azure Container Apps Jobs (cron */10)
    status: planned
  - id: CMP-006
    name: job-daily
    service: Azure Container Apps Jobs (cron diario)
    status: planned
  - id: CMP-007
    name: database
    service: Azure Database for PostgreSQL Flexible Server (B1ms). Esquema en src/vs/model/ (SQLAlchemy) y migraciones de Alembic en src/vs/model/migrations/
    status: planned
  - id: CMP-008
    name: key-vault
    service: Azure Key Vault (clave de firma ES256 no exportable)
    status: planned
  - id: CMP-009
    name: llm
    service: Claude en Microsoft Foundry (pendiente de G-6)
    status: planned
  - id: CMP-010
    name: tunnel
    service: Cloudflare Tunnel (cloudflared como app interna)
    status: planned
  - id: CMP-011
    name: edge
    service: Cloudflare (DNS, WAF, caché, Access)
    status: planned
  - id: CMP-012
    name: heartbeat-sink
    service: Microsoft Sentinel (Log Analytics, Logs Ingestion API)
    status: planned
  - id: CMP-013
    name: external-watchdog
    service: GitHub Actions (workflow programado)
    status: planned
  - id: CMP-014
    name: traces
    service: Application Insights (OpenTelemetry GenAI)
    status: planned
  - id: CMP-015
    name: social-publisher
    service: Herramienta externa de publicación en redes (Zernio; ADR-0017 aceptado)
    status: planned
  - id: CMP-016
    name: feed-archive
    service: Cloudflare R2 (páginas selladas del feed y snapshot diario; ADR-0019)
    status: planned
  - id: CMP-017
    name: donations
    service: Entrega de direcciones on-chain y lectura de cobros, solo lectura (ADR-0021)
    status: proposed
  - id: CMP-018
    name: connector-registry
    service: Registro de conectores (plugins) y configuración de instancia con guarda de licencia (src/vs/sources/base.py, src/vs/instance.py; ADR-0022)
    status: proposed
  - id: CMP-019
    name: feed-rights
    service: Filtro de señales por audiencia y nivel calculado por feed (src/vs/feed/rights.py; ADR-0022)
    status: proposed
  - id: CMP-020
    name: source-connectors
    service: Conectores abiertos (cvelistV5, CISA KEV, EPSS, GHSA, OSV) y ejecutor con source_run y fail-closed (src/vs/sources/; dentro de CMP-003)
    status: proposed
  - id: CMP-021
    name: rules-engine
    service: Motor de reglas A/B/C determinista y por feed, con impacto mínimo, E1–E4, carga inicial y monotonía (src/vs/rules/; dentro de CMP-003; PLAN §5, ADR-0012, ADR-0013, ADR-0022)
    status: proposed
  - id: CMP-022
    name: feed-builder
    service: Registro OSV 1.9 extendido por CVE, feed completo y de alertas, índice de cambios con cursor, páginas selladas por hora y 410 por retención (src/vs/feed/osv.py, changes.py, publish.py; schema/feed-1.0.0.json; dentro de CMP-005; ADR-0007, ADR-0019)
    status: proposed
  - id: CMP-023
    name: feed-signer
    service: Firma JWS detached ES256 (RFC 7797) tras la interfaz Signer; LocalDevSigner para tests y KeyVaultSigner como interfaz (src/vs/feed/sign.py; examples/verify/; ADR-0008)
    status: proposed
  - id: CMP-024
    name: exploit-connectors
    service: Conectores de exploits (Metasploit, Exploit-DB, PoC-in-GitHub, búsqueda de GitHub solo para candidatos) y heurísticas poc_suspicious leyendo metadatos y la API de contenidos, sin clonar ni ejecutar (src/vs/sources/metasploit.py, exploitdb.py, nomisec.py, github_search.py, poc.py; dentro de CMP-003; PLAN §5.3, ADR-0013, ADR-0020)
    status: proposed
  - id: CMP-025
    name: network
    service: Azure Virtual Network propia con subredes de ACA (delegada), PostgreSQL (delegada) y endpoints privados, y zonas DNS privadas (infra/modules/network.bicep; G-4)
    status: planned
  - id: CMP-026
    name: managed-identities
    service: Una identidad gestionada asignada por el usuario por componente (api, cloudflared, ingest, investigate, publish, daily, migrate), con roles sobre el recurso concreto (infra/modules/identities.bicep; G-2)
    status: planned
  - id: CMP-027
    name: job-migrate
    service: Azure Container Apps Jobs (manual). Migraciones de Alembic; su identidad es el único administrador Entra de PostgreSQL (infra/main.bicep)
    status: planned
  - id: CMP-028
    name: deploy-pipeline
    service: "GitHub Actions: images.yml (build y publicación por digest en GHCR) y deploy.yml (workflow_dispatch, entorno prod con aprobación, OIDC sin secretos de cliente, solo what-if por defecto)"
    status: planned
  - id: CMP-029
    name: image-registry
    service: GitHub Container Registry (imagen única del producto, por digest; Dockerfile sin root)
    status: planned
  - id: CMP-030
    name: product-logs
    service: Log Analytics propio con tope diario (logs del entorno ACA y base de App Insights; infra/modules/monitoring.bicep)
    status: planned
  - id: CMP-031
    name: agent-harness
    service: "Agente investigador: bucle propio con tool use (fetch_url solo GET y submit_dossier), cliente de modelo tras una interfaz (Anthropic o Foundry por configuración; FakeModel en tests), topes, JSON Schema, verificador de citas, nivel_final en código, ai_call con license_class y trazas GenAI con exportador nulo (src/vs/agent/; config/agent.yaml; dentro de CMP-004; ADR-0009, ADR-0010, ADR-0013, ADR-0022)"
    status: proposed
  - id: CMP-032
    name: agent-eval
    service: "Conjunto de evaluación del agente con respuestas simuladas, sin red (eval/cases/, python -m vs.agent.eval --model fake en CI); el modo real espera a G-6 y no corre sin configuración explícita"
    status: proposed

sources:
  - {id: SRC-001, name: cvelistV5}
  - {id: SRC-002, name: CISA KEV}
  - {id: SRC-003, name: VulnCheck KEV, status: excluded, note: "términos; ADR-0020"}
  - {id: SRC-004, name: FIRST EPSS}
  - {id: SRC-005, name: GitHub Advisory Database}
  - {id: SRC-006, name: OSV.dev}
  - {id: SRC-007, name: NVD API 2.0}
  - {id: SRC-008, name: Metasploit metadata}
  - {id: SRC-009, name: Exploit-DB}
  - {id: SRC-010, name: nuclei-templates}
  - {id: SRC-011, name: PoC-in-GitHub}
  - {id: SRC-012, name: GitHub search}
  - {id: SRC-013, name: avisos de fabricante y CERT}
  - {id: SRC-014, name: EUVD (ENISA), status: excluded, note: "licencia de reutilización SIN VERIFICAR (reintentado en T3, 2026-11-26); fuera hasta poder leerla; ADR-0022"}

trust_boundaries:
  - {id: TB-001, name: Internet ↔ borde Cloudflare}
  - {id: TB-002, name: borde Cloudflare ↔ origen Azure (solo por Tunnel)}
  - {id: TB-003, name: contenido externo no confiable ↔ agente de IA}
  - {id: TB-004, name: pipeline de GitHub ↔ Azure/Cloudflare (OIDC, token mínimo)}

