  - {id: FLW-028, from: SRC-012, to: CMP-024, crosses: [TB-003], note: "búsqueda de repositorios solo para candidatos B/C, 30/min con token; metadatos, árbol, releases y contenidos de texto pequeños"}
  - {id: FLW-029, from: CMP-024, to: CMP-021, note: "señales exploit (E1, E2, poc_unverified, poc_suspicious) por el ejecutor de fuentes"}
