  - {id: FLW-036, from: CMP-002, to: CMP-014, note: "trazas OTel con Entra ID (App Insights sin clave local)"}

threats:
  - {id: THR-001, name: inyección indirecta de prompt desde avisos, README o issues, refs: ["OWASP LLM01", "ATLAS 5.6.0 AML.T0051.001"]}
  - {id: THR-002, name: la IA baja un nivel o infla el impacto, refs: ["OWASP LLM09"]}
  - {id: THR-003, name: citas inventadas, refs: ["OWASP LLM09"]}
  - {id: THR-004, name: exfiltración o SSRF por herramientas del agente, refs: ["OWASP LLM06"]}
  - {id: THR-005, name: ejecución de código malicioso de un PoC, refs: []}
  - {id: THR-006, name: consumo desbocado de IA, refs: ["OWASP LLM10"]}
  - {id: THR-007, name: avalancha de alertas en el primer arranque, refs: []}
  - {id: THR-008, name: acceso directo al origen saltando WAF y Access, refs: []}
  - {id: THR-009, name: el monitor deja de funcionar sin que nadie se entere, refs: []}
  - {id: THR-010, name: escalada de privilegios del pipeline, refs: ["ATT&CK v20.1 T1098"]}
  - {id: THR-011, name: un dato con licencia restringida llega a un feed o a una instancia sin esa licencia, refs: []}
  - {id: THR-012, name: un documento del feed se altera en el borde, en R2 o en tránsito y el consumidor no lo detecta, refs: []}
  - {id: THR-013, name: "acceso a /admin/* sin pasar por Access o con un JWT falsificado, caducado o de otra aplicación", refs: ["OWASP API2:2023"]}
  - {id: THR-014, name: "la API pública modifica datos o expone datos de donaciones con las donaciones desactivadas", refs: []}
  - {id: THR-015, name: "un PoC falso o con malware cuenta como exploit funcional, o un módulo DoS sube a B", refs: []}
  - {id: THR-016, name: "un enlace o texto de una fuente de terceros, servido por el feed, ejecuta script en el portal (javascript:, data:) o filtra la navegación", refs: ["CWE-79"]}
  - {id: THR-017, name: "un componente comprometido usa permisos de otro (identidad compartida, rol sobre el vault entero o administración de la BD)", refs: ["ATT&CK v20.1 T1078.004"]}
  - {id: THR-018, name: "un despliegue no revisado o con una imagen o acción alterada llega a producción", refs: ["ATT&CK v20.1 T1195.002"]}
  - {id: THR-019, name: "los logs públicos de Actions exponen IDs, nombres o rangos de la plataforma", refs: []}

controls:
  - {id: CTL-001, name: "nivel_final = max(determinista, IA) en código", mitigates: [THR-002], proof: "tests/test_rules.py (monotonía con hypothesis; la IA no baja; solo baja un acto manual registrado); tests/test_agent.py (el agente nunca deja el nivel por debajo del determinista ni del publicado, con hypothesis; el intento queda en ai_call.blocked_downgrade)"}
  - {id: CTL-002, name: "verificador determinista de citas: cita literal normalizada, con longitud mínima y, en código, dentro de las líneas citadas; una afirmación con una cita no verificada se descarta", mitigates: [THR-003], proof: "eval/cases/citation-fabricated.yaml; tests/test_agent.py (verificador y sabotaje: el arnés falla si se acepta una cita inventada)"}
  - {id: CTL-003, name: "contenido externo delimitado como datos (<external_content>, cierre neutralizado) y herramientas de solo lectura; el agente no tiene herramienta de publicar", mitigates: [THR-001], proof: "eval/cases/injection-advisory.yaml e injection-readme-escalate.yaml; tests/test_agent.py (herramientas desconocidas denegadas y sin ejecutar)"}
  - {id: CTL-004, name: "lista de dominios permitidos aplicada en código (host exacto, https, puerto 443, sin usuario ni IP) y solo GET sin redirecciones", mitigates: [THR-004], proof: "tests/test_agent.py (tabla de URL permitidas y bloqueadas; una URL bloqueada no llega al transporte); eval/cases/domain-off-list.yaml"}
  - {id: CTL-005, name: código de PoC leído como texto, nunca ejecutado, mitigates: [THR-005], proof: revisión de contenedor en CI}
  - {id: CTL-006, name: "topes de 12 pasos, 60.000 tokens por candidato y 1,5 USD/día (compartido entre candidatos); al superarlos, needs_human", mitigates: [THR-006], proof: "eval/cases/budget-*.yaml; tests/test_agent.py (bucle simulado, tokens y USD/día)"}
  - {id: CTL-007, name: carga inicial de referencia por fuente, mitigates: [THR-007], proof: "tests/test_rules.py (carga inicial y fuente nueva: 0 alertas; señal nueva sobre CVE antigua: alerta)"}
  - {id: CTL-008, name: origen sin IP pública (Tunnel), mitigates: [THR-008], proof: curl directo al origen falla}
  - {id: CTL-009, name: latido en Sentinel y vigilante externo, mitigates: [THR-009], proof: prueba de caos F3}
  - {id: CTL-010, name: RBAC Administrator con condición sobre el RG, mitigates: [THR-010], proof: intento de autoasignación denegado}
  - {id: CTL-011, name: "license_class en cada dato; la instancia pública no carga conectores restricted ni guarda filas restricted; nivel por feed; la API pública no arranca con un publicador que admita restricted", mitigates: [THR-011], proof: "tests/test_license_rights.py; tests/test_feed.py (el feed público no lleva datos restricted aunque se los pasen al publicador); tests/test_api.py (ninguna respuesta lleva datos restricted)"}
  - {id: CTL-012, name: "fail-closed por fuente: timeout, HTTP no 2xx, dato roto, lectura incompleta o dato más viejo que el umbral dan source_run UNKNOWN y ningún registro", mitigates: [THR-009], proof: tests/test_sources.py}
  - {id: CTL-013, name: "los conectores solo siguen enlaces bajo la URL base configurada; OSV no lee fuentes sin licencia comprobada", mitigates: [THR-004, THR-011], proof: tests/test_sources.py}
  - {id: CTL-014, name: "cada documento del feed lleva su JWS detached ES256 sobre los bytes exactos, verificable con openssl y Python; ETag y sha256 del índice iguales al hash del registro", mitigates: [THR-012], proof: "tests/test_feed_sign.py; tests/test_feed.py; tests/test_api.py (cada documento servido verifica con su .jws)"}
  - {id: CTL-015, name: "el origen valida el JWT de Access en /admin/* (RS256 con las claves del equipo, iss, aud, exp y nbf); sin configuración, /admin cerrado", mitigates: [THR-013], proof: "tests/test_api.py (sin JWT 401; firma, kid, alg, aud, iss o vigencia malos 403; sin configuración 403)"}
  - {id: CTL-016, name: "API pública solo GET y sin escritura; los datos donations.* no salen con donations.enabled=false", mitigates: [THR-014], proof: "tests/test_api.py (405 en métodos de escritura; el publicador no cambia; ninguna respuesta lleva donaciones)"}
  - {id: CTL-017, name: "heurísticas poc_suspicious (binarios, blobs u ofuscación, curl|sh y descargas ajenas, cuenta de menos de 30 días, README sin código, fork) sobre metadatos y la API de contenidos, sin clonar ni ejecutar; un PoC sin inspección completa nunca es limpio; el tipo de módulo o de entrada (auxiliary/dos, dos) se conserva para que no cuente como exploit", mitigates: [THR-005, THR-015], proof: "tests/test_exploit_sources.py (una prueba por heurística con fixtures sintéticos; el inspector solo pide URLs de la API; integración: un módulo DoS no da B)"}
  - {id: CTL-018, name: "el portal solo pone en un href enlaces https (safeUrl), con rel=noopener noreferrer; React escapa el texto y no se usa HTML del feed; referrer no-referrer; un id de alerta mal formado no llega a la API", mitigates: [THR-016], proof: "web/src/test/units.test.tsx (safeUrl); web/src/test/pages.test.tsx (javascript: nunca en href; id mal formado sin petición)"}
  - {id: CTL-019, name: "una identidad por componente; Crypto User solo sobre la clave de firma, Secrets User solo sobre cada secreto, Metrics Publisher solo sobre App Insights y la DCR; solo migrate administra PostgreSQL (Entra ID, sin contraseña); KV y PostgreSQL sin acceso público", mitigates: [THR-017], proof: "infra/ (az bicep build y lint en CI); revisión de las asignaciones tras el primer despliegue (F1a)"}
  - {id: CTL-020, name: "despliegue solo manual desde main, entorno prod con aprobación, OIDC sin secretos de cliente, imagen por digest, acciones fijadas por SHA, what-if por defecto", mitigates: [THR-010, THR-018], proof: ".github/workflows/deploy.yml validado con actionlint en CI"}
  - {id: CTL-021, name: "configuración del despliegue como secrets enmascarados; ningún paso imprime la salida de az (el what-if solo da el recuento)", mitigates: [THR-019], proof: ".github/workflows/deploy.yml"}
  - {id: CTL-022, name: "lo que la IA puede subir está acotado en código: el nivel propuesto se recorta a lo que prueban las citas verificadas; A solo con una cita de un aviso oficial (official_advisory_domains, nunca un repositorio de PoC); E5 solo de C a B, con líneas de código citadas y el impact_class del CVE; el agente no puede declarar más impact_class que el del CVE (el intento se registra); la salida que no valida el JSON Schema se rechaza", mitigates: [THR-001, THR-002, THR-003], proof: "eval/cases/impact-inflation.yaml, injection-readme-escalate.yaml, schema-*.yaml y positive-*.yaml; tests/test_agent.py"}
