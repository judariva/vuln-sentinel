# Arquitectura de vuln-sentinel como datos (D12).
# Reglas:
#   - Los IDs son estables y NUNCA se reutilizan. Un elemento retirado se marca `status: retired`.
#   - Las vistas (views/*.md) y los ADR solo referencian IDs de este fichero; un test lo comprueba.
#   - Sin nombres de recursos internos, IDs de tenant/suscripción ni IP (regla 8): los nombres de
#     servicio son los del producto de Azure/Cloudflare.
schema_version: 1
id_prefixes:
  CMP: componente
  FLW: flujo
  TB: frontera de confianza
  CTL: control
  THR: amenaza
  SRC: fuente externa

components:
  - id: CMP-001
    name: front
    service: Cloudflare Workers static assets
    status: planned
  - id: CMP-002
    name: api
    service: Azure Container Apps (app)
    status: planned
  - id: CMP-003
    name: job-ingest
    service: Azure Container Apps Jobs (cron */5)
    status: planned
  - id: CMP-004
    name: job-investigate
    service: Azure Container Apps Jobs (cron */10)
    status: planned
  - id: CMP-005
    name: job-publish
    service: Azure Container Apps Jobs (cron */10)
    status: planned
  - id: CMP-006
    name: job-daily
    service: Azure Container Apps Jobs (cron diario)
    status: planned
  - id: CMP-007
    name: database
    service: Azure Database for PostgreSQL Flexible Server (B1ms). Esquema en src/vs/model/ (SQLAlchemy) y migraciones de Alembic en src/vs/model/migrations/
    status: planned
  - id: CMP-008
    name: key-vault
    service: Azure Key Vault (clave de firma ES256 no exportable)
    status: planned
  - id: CMP-009
    name: llm
    service: Claude en Microsoft Foundry (pendiente de G-6)
    status: planned
  - id: CMP-010
    name: tunnel
    service: Cloudflare Tunnel (cloudflared como app interna)
    status: planned
  - id: CMP-011
    name: edge
    service: Cloudflare (DNS, WAF, caché, Access)
    status: planned
  - id: CMP-012
    name: heartbeat-sink
    service: Microsoft Sentinel (Log Analytics, Logs Ingestion API)
    status: planned
  - id: CMP-013
    name: external-watchdog
    service: GitHub Actions (workflow programado)
    status: planned
  - id: CMP-014
    name: traces
    service: Application Insights (OpenTelemetry GenAI)
    status: planned
  - id: CMP-015
    name: social-publisher
    service: Herramienta externa de publicación en redes (Zernio; ADR-0017 aceptado)
    status: planned
  - id: CMP-016
    name: feed-archive
    service: Cloudflare R2 (páginas selladas del feed y snapshot diario; ADR-0019)
    status: planned
  - id: CMP-017
    name: donations
    service: Entrega de direcciones on-chain y lectura de cobros, solo lectura (ADR-0021)
    status: proposed
  - id: CMP-018
    name: connector-registry
    service: Registro de conectores (plugins) y configuración de instancia con guarda de licencia (src/vs/sources/base.py, src/vs/instance.py; ADR-0022)
    status: proposed
  - id: CMP-019
    name: feed-rights
    service: Filtro de señales por audiencia y nivel calculado por feed (src/vs/feed/rights.py; ADR-0022)
    status: proposed
  - id: CMP-020
    name: source-connectors
    service: Conectores abiertos (cvelistV5, CISA KEV, EPSS, GHSA, OSV) y ejecutor con source_run y fail-closed (src/vs/sources/; dentro de CMP-003)
    status: proposed
  - id: CMP-021
    name: rules-engine
    service: Motor de reglas A/B/C determinista y por feed, con impacto mínimo, E1–E4, carga inicial y monotonía (src/vs/rules/; dentro de CMP-003; PLAN §5, ADR-0012, ADR-0013, ADR-0022)
    status: proposed
  - id: CMP-022
    name: feed-builder
    service: Registro OSV 1.9 extendido por CVE, feed completo y de alertas, índice de cambios con cursor, páginas selladas por hora y 410 por retención (src/vs/feed/osv.py, changes.py, publish.py; schema/feed-1.0.0.json; dentro de CMP-005; ADR-0007, ADR-0019)
    status: proposed
  - id: CMP-023
    name: feed-signer
    service: Firma JWS detached ES256 (RFC 7797) tras la interfaz Signer; LocalDevSigner para tests y KeyVaultSigner como interfaz (src/vs/feed/sign.py; examples/verify/; ADR-0008)
    status: proposed

sources:
  - {id: SRC-001, name: cvelistV5}
  - {id: SRC-002, name: CISA KEV}
  - {id: SRC-003, name: VulnCheck KEV, status: excluded, note: "términos; ADR-0020"}
  - {id: SRC-004, name: FIRST EPSS}
  - {id: SRC-005, name: GitHub Advisory Database}
  - {id: SRC-006, name: OSV.dev}
  - {id: SRC-007, name: NVD API 2.0}
  - {id: SRC-008, name: Metasploit metadata}
  - {id: SRC-009, name: Exploit-DB}
  - {id: SRC-010, name: nuclei-templates}
  - {id: SRC-011, name: PoC-in-GitHub}
  - {id: SRC-012, name: GitHub search}
  - {id: SRC-013, name: avisos de fabricante y CERT}
  - {id: SRC-014, name: EUVD (ENISA), status: excluded, note: "licencia de reutilización SIN VERIFICAR (reintentado en T3, 2026-11-26); fuera hasta poder leerla; ADR-0022"}

trust_boundaries:
  - {id: TB-001, name: Internet ↔ borde Cloudflare}
  - {id: TB-002, name: borde Cloudflare ↔ origen Azure (solo por Tunnel)}
  - {id: TB-003, name: contenido externo no confiable ↔ agente de IA}
  - {id: TB-004, name: pipeline de GitHub ↔ Azure/Cloudflare (OIDC, token mínimo)}

flows:
  - {id: FLW-001, from: SRC-001, to: CMP-003, crosses: [TB-003]}
  - {id: FLW-002, from: CMP-003, to: CMP-007}
  - {id: FLW-003, from: CMP-004, to: CMP-009, crosses: [TB-003]}
  - {id: FLW-004, from: CMP-005, to: CMP-008, note: firma del feed}
  - {id: FLW-005, from: CMP-011, to: CMP-002, crosses: [TB-001, TB-002], via: CMP-010}
  - {id: FLW-006, from: CMP-003, to: CMP-012, note: latido}
  - {id: FLW-007, from: CMP-013, to: CMP-011, crosses: [TB-001], note: vigilante externo}
  - {id: FLW-008, from: CMP-005, to: CMP-016, note: páginas selladas y snapshot (token limitado al bucket)}
  - {id: FLW-009, from: CMP-005, to: CMP-015, crosses: [TB-001], note: post aprobado (adaptador SocialPublisher)}
  - {id: FLW-010, from: CMP-011, to: CMP-016, note: servir feed archivado desde caché}
  - {id: FLW-011, from: CMP-003, to: CMP-018, note: "el ingest solo carga los conectores que la instancia admite (ADR-0022)"}
  - {id: FLW-012, from: CMP-005, to: CMP-019, note: "cada feed se genera con las señales que su audiencia puede recibir (ADR-0022)"}
  - {id: FLW-013, from: SRC-002, to: CMP-020, crosses: [TB-003], note: "catálogo KEV (JSON)"}
  - {id: FLW-014, from: SRC-004, to: CMP-020, crosses: [TB-003], note: "CSV diario de EPSS"}
  - {id: FLW-015, from: SRC-005, to: CMP-020, crosses: [TB-003], note: "API de avisos de GitHub, paginada"}
  - {id: FLW-016, from: SRC-006, to: CMP-020, crosses: [TB-003], note: "modified_id.csv y registros OSV, con política por fuente"}
  - {id: FLW-017, from: CMP-020, to: CMP-007, note: "source_run y registros normalizados al modelo"}
  - {id: FLW-018, from: CMP-020, to: CMP-021, note: "registros sellados (observed_at, baseline) que evalúan las reglas"}
  - {id: FLW-019, from: CMP-021, to: CMP-007, note: "rule_evaluation y alert_level_history"}
  - {id: FLW-020, from: CMP-021, to: CMP-022, note: "nivel publicado, historial y registros del feed (solo lo que su audiencia puede recibir)"}
  - {id: FLW-021, from: CMP-022, to: CMP-023, note: "bytes exactos de cada documento → JWS detached (.jws)"}
  - {id: FLW-022, from: CMP-023, to: CMP-008, note: "operación sign de Key Vault sobre el resumen SHA-256 (F1a; hoy solo interfaz)"}

threats:
  - {id: THR-001, name: inyección indirecta de prompt desde avisos, README o issues, refs: ["OWASP LLM01", "ATLAS 5.6.0 AML.T0051.001"]}
  - {id: THR-002, name: la IA baja un nivel o infla el impacto, refs: ["OWASP LLM09"]}
  - {id: THR-003, name: citas inventadas, refs: ["OWASP LLM09"]}
  - {id: THR-004, name: exfiltración o SSRF por herramientas del agente, refs: ["OWASP LLM06"]}
  - {id: THR-005, name: ejecución de código malicioso de un PoC, refs: []}
  - {id: THR-006, name: consumo desbocado de IA, refs: ["OWASP LLM10"]}
  - {id: THR-007, name: avalancha de alertas en el primer arranque, refs: []}
  - {id: THR-008, name: acceso directo al origen saltando WAF y Access, refs: []}
  - {id: THR-009, name: el monitor deja de funcionar sin que nadie se entere, refs: []}
  - {id: THR-010, name: escalada de privilegios del pipeline, refs: ["ATT&CK v20.1 T1098"]}
  - {id: THR-011, name: un dato con licencia restringida llega a un feed o a una instancia sin esa licencia, refs: []}
  - {id: THR-012, name: un documento del feed se altera en el borde, en R2 o en tránsito y el consumidor no lo detecta, refs: []}

controls:
  - {id: CTL-001, name: "nivel_final = max(determinista, IA) en código", mitigates: [THR-002], proof: "tests/test_rules.py (monotonía con hypothesis; la IA no baja; solo baja un acto manual registrado)"}
  - {id: CTL-002, name: verificador determinista de citas, mitigates: [THR-003], proof: eval citas falsas}
  - {id: CTL-003, name: contenido externo delimitado y herramientas de solo lectura, mitigates: [THR-001], proof: eval injection-advisory}
  - {id: CTL-004, name: lista de dominios permitidos y solo GET, mitigates: [THR-004], proof: test de herramienta}
  - {id: CTL-005, name: código de PoC leído como texto, nunca ejecutado, mitigates: [THR-005], proof: revisión de contenedor en CI}
  - {id: CTL-006, name: topes de pasos, tokens y coste diario, mitigates: [THR-006], proof: test de bucle simulado}
  - {id: CTL-007, name: carga inicial de referencia por fuente, mitigates: [THR-007], proof: "tests/test_rules.py (carga inicial y fuente nueva: 0 alertas; señal nueva sobre CVE antigua: alerta)"}
  - {id: CTL-008, name: origen sin IP pública (Tunnel), mitigates: [THR-008], proof: curl directo al origen falla}
  - {id: CTL-009, name: latido en Sentinel y vigilante externo, mitigates: [THR-009], proof: prueba de caos F3}
  - {id: CTL-010, name: RBAC Administrator con condición sobre el RG, mitigates: [THR-010], proof: intento de autoasignación denegado}
  - {id: CTL-011, name: "license_class en cada dato; la instancia pública no carga conectores restricted ni guarda filas restricted; nivel por feed", mitigates: [THR-011], proof: "tests/test_license_rights.py; tests/test_feed.py (el feed público no lleva datos restricted aunque se los pasen al publicador)"}
  - {id: CTL-012, name: "fail-closed por fuente: timeout, HTTP no 2xx, dato roto, lectura incompleta o dato más viejo que el umbral dan source_run UNKNOWN y ningún registro", mitigates: [THR-009], proof: tests/test_sources.py}
  - {id: CTL-013, name: "los conectores solo siguen enlaces bajo la URL base configurada; OSV no lee fuentes sin licencia comprobada", mitigates: [THR-004, THR-011], proof: tests/test_sources.py}
  - {id: CTL-014, name: "cada documento del feed lleva su JWS detached ES256 sobre los bytes exactos, verificable con openssl y Python; ETag y sha256 del índice iguales al hash del registro", mitigates: [THR-012], proof: "tests/test_feed_sign.py; tests/test_feed.py"}
