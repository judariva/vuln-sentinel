# Arquitectura de vuln-sentinel como datos (D12).
# Reglas:
#   - Los IDs son estables y NUNCA se reutilizan. Un elemento retirado se marca `status: retired`.
#   - Las vistas (views/*.md) y los ADR solo referencian IDs de este fichero; un test lo comprueba.
#   - Sin nombres de recursos internos, IDs de tenant/suscripción ni IP (regla 8): los nombres de
#     servicio son los del producto de Azure/Cloudflare.
schema_version: 1
id_prefixes:
  CMP: componente
  FLW: flujo
  TB: frontera de confianza
  CTL: control
  THR: amenaza
  SRC: fuente externa

components:
  - id: CMP-001
    name: front
    service: Cloudflare Workers static assets. SPA en web/ (Vite + React + shadcn/ui, ADR-0023; movimiento con Motion y Magic UI, escena 3D en un bloque aparte, ADR-0024); consume la API pública como cualquier cliente
    status: planned
  - id: CMP-002
    name: api
    service: Azure Container Apps (app). FastAPI de solo lectura (src/vs/api/); /admin/* solo con el JWT de Access (esqueleto)
    status: planned
  - id: CMP-003
    name: job-ingest
    service: Azure Container Apps Jobs (cron */5)
    status: planned
  - id: CMP-004
    name: job-investigate
    service: Azure Container Apps Jobs (cron */10)
    status: planned
  - id: CMP-005
    name: job-publish
    service: Azure Container Apps Jobs (cron */10)
    status: planned
  - id: CMP-006
    name: job-daily
    service: Azure Container Apps Jobs (cron diario)
    status: planned
  - id: CMP-007
    name: database
    service: Azure Database for PostgreSQL Flexible Server (B1ms). Esquema en src/vs/model/ (SQLAlchemy) y migraciones de Alembic en src/vs/model/migrations/
    status: planned
  - id: CMP-008
    name: key-vault
    service: Azure Key Vault (clave de firma ES256 no exportable)
    status: planned
  - id: CMP-009
    name: llm
    service: Claude en Microsoft Foundry (pendiente de G-6)
    status: planned
  - id: CMP-010
    name: tunnel
    service: Cloudflare Tunnel (cloudflared como app interna)
    status: planned
  - id: CMP-011
    name: edge
    service: Cloudflare (DNS, WAF, caché, Access)
    status: planned
  - id: CMP-012
    name: heartbeat-sink
    service: Microsoft Sentinel (Log Analytics, Logs Ingestion API; tabla VsHeartbeat_CL y DCR de G-7)
    status: planned
  - id: CMP-013
    name: external-watchdog
    service: "GitHub Actions (.github/workflows/watchdog.yml, cada 30 min y manual): python -m vs.watchdog lee el índice «head» por el borde, verifica la firma JWS (clave fijada en VS_FEED_JWKS o la publicada) y comprueba modified < 30 min y ninguna fuente en UNKNOWN > 2 h; sin VS_FEED_BASE_URL el job sale «saltado»"
    status: planned
  - id: CMP-014
    name: traces
    service: Application Insights (OpenTelemetry GenAI)
    status: planned
  - id: CMP-015
    name: social-publisher
    service: Herramienta externa de publicación en redes (Zernio; ADR-0017 aceptado)
    status: planned
  - id: CMP-016
    name: feed-archive
    service: Cloudflare R2 (páginas selladas del feed y snapshot diario; ADR-0019)
    status: planned
  - id: CMP-017
    name: donations
    service: Entrega de direcciones on-chain y lectura de cobros, solo lectura (ADR-0021)
    status: proposed
  - id: CMP-018
    name: connector-registry
    service: Registro de conectores (plugins) y configuración de instancia con guarda de licencia (src/vs/sources/base.py, src/vs/instance.py; ADR-0022)
    status: proposed
  - id: CMP-019
    name: feed-rights
    service: Filtro de señales por audiencia y nivel calculado por feed (src/vs/feed/rights.py; ADR-0022)
    status: proposed
  - id: CMP-020
    name: source-connectors
    service: Conectores abiertos (cvelistV5, CISA KEV, EPSS, GHSA, OSV) y ejecutor con source_run y fail-closed (src/vs/sources/; dentro de CMP-003)
    status: proposed
  - id: CMP-021
    name: rules-engine
    service: Motor de reglas A/B/C determinista y por feed, con impacto mínimo, E1–E4, carga inicial y monotonía (src/vs/rules/; dentro de CMP-003; PLAN §5, ADR-0012, ADR-0013, ADR-0022)
    status: proposed
  - id: CMP-022
    name: feed-builder
    service: Registro OSV 1.9 extendido por CVE, feed completo y de alertas, índice de cambios con cursor, páginas selladas por hora y 410 por retención (src/vs/feed/osv.py, changes.py, publish.py; schema/feed-1.0.0.json; dentro de CMP-005; ADR-0007, ADR-0019)
    status: proposed
  - id: CMP-023
    name: feed-signer
    service: Firma JWS detached ES256 (RFC 7797) tras la interfaz Signer; LocalDevSigner para tests y KeyVaultSigner como interfaz (src/vs/feed/sign.py; examples/verify/; ADR-0008)
    status: proposed
  - id: CMP-024
    name: exploit-connectors
    service: Conectores de exploits (Metasploit, Exploit-DB, PoC-in-GitHub, búsqueda de GitHub solo para candidatos) y heurísticas poc_suspicious leyendo metadatos y la API de contenidos, sin clonar ni ejecutar (src/vs/sources/metasploit.py, exploitdb.py, nomisec.py, github_search.py, poc.py; dentro de CMP-003; PLAN §5.3, ADR-0013, ADR-0020)
    status: proposed
  - id: CMP-025
    name: network
    service: "Red de la plataforma (landing zone): subred de ACA (delegada, con NSG), subred de PostgreSQL (delegada) y zona DNS privada de PostgreSQL. El módulo Terraform las recibe como entradas y no crea ninguna (ADR-0025; diseño anterior en infra/bicep-legacy/modules/network.bicep; G-4)"
    status: planned
  - id: CMP-026
    name: managed-identities
    service: "Identidades gestionadas asignadas por el usuario de los componentes (api, cloudflared, ingest, investigate, publish, daily, migrate). Las crea el vending de la plataforma y concede sus roles; el módulo Terraform las recibe (variable identities) y publica la lista de roles con su alcance en la salida required_platform_grants (ADR-0025). Una por componente es el objetivo (ADR-0014); si la plataforma da una sola, se comparte (pregunta abierta de T16)"
    status: planned
  - id: CMP-027
    name: job-migrate
    service: Azure Container Apps Jobs (manual). Migraciones de Alembic; su identidad es el único administrador Entra de PostgreSQL (infra/terraform/modules/vuln-sentinel/postgres.tf y jobs.tf)
    status: planned
  - id: CMP-028
    name: deploy-pipeline
    service: "GitHub Actions: images.yml (build y publicación por digest en GHCR con SBOM y procedencia firmados). deploy.yml se retiró (ADR-0025, queda en infra/bicep-legacy/workflows/): despliega CMP-039"
    status: planned
  - id: CMP-029
    name: image-registry
    service: GitHub Container Registry (imagen única del producto, por digest, con sus atestaciones de SBOM y procedencia; Dockerfile sin root y con la base por digest)
    status: planned
  - id: CMP-030
    name: product-logs
    service: Log Analytics propio con tope diario (logs del entorno ACA y base de App Insights; infra/bicep-legacy/modules/monitoring.bicep). Retirado por ADR-0025 — los diagnósticos allLogs van al workspace de la plataforma (entrada del módulo)
    status: retired
  - id: CMP-031
    name: agent-harness
    service: "Agente investigador: bucle propio con tool use (fetch_url solo GET y submit_dossier), cliente de modelo tras una interfaz (Anthropic o Foundry por configuración; FakeModel en tests), topes, JSON Schema, verificador de citas, alcance de dominios por CVE desde las referencias vendor-advisory del CNA (scope.py), E5 determinista contra señuelos (e5.py), nivel_final en código, ai_call con license_class y trazas GenAI con exportador nulo (src/vs/agent/; config/agent.yaml; dentro de CMP-004; ADR-0009, ADR-0010, ADR-0013, ADR-0022)"
    status: proposed
  - id: CMP-032
    name: agent-eval
    service: "Conjunto de evaluación del agente con respuestas simuladas, sin red (eval/cases/, python -m vs.agent.eval --model fake en CI); el modo real espera a G-6 y no corre sin configuración explícita"
    status: proposed
  - id: CMP-033
    name: heartbeat-client
    service: "Latido de cada job (job, resultado, fuentes en UNKNOWN desde cuándo, coste de IA del día) tras la interfaz HeartbeatClient; LogsIngestionClient con la identidad gestionada del job (solo interfaz hasta la F1a) y FakeHeartbeatClient en tests; salud de fuentes en src/vs/sources/health.py (src/vs/heartbeat/; dentro de CMP-003 a CMP-006)"
    status: proposed
  - id: CMP-034
    name: ntfy
    service: "ntfy (servicio público o instancia propia): tema de nombre aleatorio con control de acceso (G-16); recibe los avisos de los dos vigilantes (P-9)"
    status: planned
  - id: CMP-035
    name: list-generators
    service: Scripts reproducibles src/vs/lists (exposed-products y trusted-exploit-authors; F1a-0)
    status: implemented
  - id: CMP-036
    name: store
    service: "Persistencia de los jobs en PostgreSQL (src/vs/store.py, T13): ingesta idempotente por huella (fact_seen), carga inicial sin alertas también para CVE que llegan tarde, reglas con estado guardado y feed publicado (feed_record, feed_change) que comparten el job de publicación y la API; dentro de CMP-002 a CMP-006"
    status: implemented
  - id: CMP-037
    name: local-stack
    service: "Prueba en local con datos reales: compose.yaml (PostgreSQL, migrate, bucle ingest → publish cada 5 min y daily cada hora con vs.jobs.loop, API con el portal en el mismo origen) e infra/compose/Dockerfile; solo desarrollo, no se despliega"
    status: implemented
  - id: CMP-038
    name: product-iac-module
    service: "Módulo Terraform reutilizable del producto (infra/terraform/modules/vuln-sentinel/; azurerm 4.81.0 y azapi 2.14.0 fijados): entorno de ACA interno en VNet, API, jobs, cloudflared opcional, PostgreSQL Flexible privado solo con Entra, clave de firma por ARM y diagnósticos allLogs; no crea identidades, roles, RG, Key Vault ni zonas DNS. Ejemplo en infra/terraform/examples/golden-dev/ (ADR-0025, ADR-0022)"
    status: implemented
  - id: CMP-039
    name: platform-factory
    service: "Factoría de la plataforma (Golden Tenant), externa a este repo: vending del landing zone (RG, UAMI, Key Vault privado, presupuesto, guardarraíles y roles de required_platform_grants) e instancia de CMP-038 fijado por versión, con sus identidades de CI y plan/apply revisado (ADR-0025)"
    status: planned

