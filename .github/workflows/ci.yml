name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # PostgreSQL desechable para los tests `db` (migraciones y consultas de métricas). La
    # contraseña es de usar y tirar: el contenedor solo existe durante el job y no es un secreto.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Actions fijadas por SHA (tag entre comentarios).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Tests
        env:
          # Hosts reales de la marca (ADR-0016); en un secret para no escribirlos en el repo.
          VS_FORBIDDEN_HOSTS: ${{ secrets.VS_FORBIDDEN_HOSTS }}
          VS_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
        run: uv run pytest -rs
      # Conjunto de evaluación del agente con el modelo simulado (T10, PLAN §7). Sin red ni
      # modelo real: el modo `--model real` no corre sin configuración explícita.
      - name: Evaluación del agente (modelo simulado)
        run: uv run python -m vs.agent.eval --model fake

  # Infraestructura como código (T9): compila y pasa el lint de Bicep y valida los workflows.
  # Sin login en Azure: nada de este job toca la nube.
  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Bicep (build y lint)
        run: |
          for f in infra/main.bicep infra/platform/platform.bicep; do
            az bicep build --file "$f" --stdout > /dev/null
            az bicep lint --file "$f"
          done
          for f in infra/main.bicepparam infra/platform/platform.bicepparam; do
            az bicep lint --file "$f"
          done
      - name: actionlint
        run: uv run --no-project --with actionlint-py==1.7.12.25 actionlint

  # Portal (T8a, ADR-0023): build, lint, tests de componentes y prueba de humo con axe contra la
  # API de T6 con fixtures (`tests/portal_fixture.py`), todo en 127.0.0.1.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SHA leído en la página del commit de la release v7.1.0 (2026-11-26); verificar con
      # `git ls-remote` antes de fusionar (informe de T8a).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Dependencias de Python (API con fixtures)
        working-directory: .
        run: uv sync --locked
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # T8b: JS inicial sin 3D <= 250 KB gzip y bloque 3D <= 400 KB gzip (ADR-0024).
      - name: Presupuestos del build
        run: npm run budget
      - name: Tests de componentes
        run: npm test
      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: Prueba de humo y axe
        run: npx playwright test

  # Lighthouse (T8c, ADR-0024): la medida que vale es esta, en una máquina estable, no la de WSL.
  # Mediana de 3 pasadas por pantalla en los perfiles móvil y escritorio. Falla si no se cumple:
  # móvil >= 90 en Detalle, Fuentes y Administración y >= 85 en Hoy y Métricas; escritorio >= 90
  # en las 5. Los informes y `summary.json` quedan como artefacto.
  lighthouse:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Dependencias de Python (API con fixtures)
        working-directory: .
        run: uv sync --locked
      - name: Instalar dependencias
        run: npm ci
      - name: Build
        run: npm run build
      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium
      # Sin GPU no hay WebGL: el script arranca Chromium con SwiftShader (por software) para que la
      # escena 3D de Hoy cargue y se mida, y falla si Hoy se midió sin ella (`scene3d` en el resumen).
      - name: Lighthouse (móvil y escritorio, mediana de 3)
        run: npm run perf -- "$RUNNER_TEMP/lighthouse"
      - name: Informes de Lighthouse
        if: always()
        # SHA de la etiqueta v7.0.2 leído en la API de GitHub (git/ref/tags/v7.0.2) el 2026-11-26.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: |
            ${{ runner.temp }}/lighthouse/summary.json
            ${{ runner.temp }}/lighthouse/mobile/*.json
            ${{ runner.temp }}/lighthouse/desktop/*.json
          if-no-files-found: warn
          retention-days: 30
