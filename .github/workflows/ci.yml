name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # PostgreSQL desechable para los tests `db` (migraciones y consultas de métricas). La
    # contraseña es de usar y tirar: el contenedor solo existe durante el job y no es un secreto.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Actions fijadas por SHA (tag entre comentarios).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Tests
        env:
          # Hosts reales de la marca (ADR-0016); en un secret para no escribirlos en el repo.
          VS_FORBIDDEN_HOSTS: ${{ secrets.VS_FORBIDDEN_HOSTS }}
          VS_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
        run: uv run pytest -rs
      # Conjunto de evaluación del agente con el modelo simulado (T10, PLAN §7). Sin red ni
      # modelo real: el modo `--model real` no corre sin configuración explícita.
      - name: Evaluación del agente (modelo simulado)
        run: uv run python -m vs.agent.eval --model fake

  # Workflows (T9): actionlint. El Bicep de infra/bicep-legacy/ es referencia y no se compila
  # (ADR-0025): la infraestructura es el módulo Terraform del job `terraform`.
  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: actionlint
        run: uv run --no-project --with actionlint-py==1.7.12.25 actionlint

  # Módulo Terraform del producto (T16, ADR-0025): fmt, validate, tflint y Checkov, sin
  # credenciales ni backend. Nada de plan ni apply: despliega la factoría de la plataforma.
  # Binarios descargados por versión y comprobados por sha256 (leídos en las releases el 2026-11-26).
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TF_VERSION: 1.15.7
      TF_SHA256: 73bbb8f5188ad75d4fb853fd100ae4d7e146ef7af7db18776109642fdb7759d2
      TFLINT_VERSION: 0.66.0
      TFLINT_SHA256: 22be11cadc25cd02401e94c0ccc91aa63467debb8485c2a755d98f4c0a9d1e2e
      CHECKOV_VERSION: 3.4.11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Instalar terraform y tflint
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -sSfL -o terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  terraform.zip" | sha256sum -c -
          curl -sSfL -o tflint.zip "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  tflint.zip" | sha256sum -c -
          unzip -q -o terraform.zip -d "$bin"
          unzip -q -o tflint.zip -d "$bin"
          echo "$bin" >> "$GITHUB_PATH"
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform
      - name: terraform validate (módulo y ejemplo)
        run: |
          # El ejemplo fija la versión exacta y verifica los proveedores contra su lock versionado;
          # el módulo solo pone el rango (>= con techo de mayor) y no lleva lock (T16b).
          terraform -chdir=infra/terraform/examples/golden-lab init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/terraform/examples/golden-lab validate
          terraform -chdir=infra/terraform/modules/vuln-sentinel init -backend=false -input=false
          terraform -chdir=infra/terraform/modules/vuln-sentinel validate
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cfg="$PWD/infra/terraform/.tflint.hcl"
          tflint --init --config "$cfg"
          tflint --chdir infra/terraform/modules/vuln-sentinel --config "$cfg"
          tflint --chdir infra/terraform/examples/golden-lab --config "$cfg" --call-module-type=all
      - name: Checkov
        run: uv run --no-project --with "checkov==${CHECKOV_VERSION}" checkov -d infra/terraform/modules/vuln-sentinel --framework terraform --compact

  # Portal (T8a, ADR-0023): build, lint, tests de componentes y prueba de humo con axe contra la
  # API de T6 con fixtures (`tests/portal_fixture.py`), todo en 127.0.0.1.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SHA de la etiqueta v7.1.0 comprobado con `git ls-remote` (revisión de 2026-11-26).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Dependencias de Python (API con fixtures)
        working-directory: .
        run: uv sync --locked
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # T8b: JS inicial sin 3D <= 250 KB gzip y bloque 3D <= 400 KB gzip (ADR-0024).
      - name: Presupuestos del build
        run: npm run budget
      - name: Tests de componentes
        run: npm test
      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: Prueba de humo y axe
        run: npx playwright test

  # Lighthouse (T8c, ADR-0024): la medida que vale es esta, en una máquina estable, no la de WSL.
  # Mediana de 3 pasadas por pantalla en los perfiles móvil y escritorio. Falla si no se cumple:
  # móvil >= 90 en Detalle, Fuentes y Administración y >= 85 en Hoy y Métricas; escritorio >= 90
  # en las 5. Los informes y `summary.json` quedan como artefacto.
  lighthouse:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Dependencias de Python (API con fixtures)
        working-directory: .
        run: uv sync --locked
      - name: Instalar dependencias
        run: npm ci
      - name: Build
        run: npm run build
      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium
      # Sin GPU, Chromium usa WebGL por software (SwiftShader) y el portal deja Hoy en SVG, como lo
      # vería una persona sin GPU: eso es lo que se mide con umbral (`render` en el resumen, T8d). Hoy
      # móvil con la escena forzada se mide aparte, solo como dato (`forced`, sin umbral).
      - name: Lighthouse (móvil y escritorio, mediana de 3)
        run: npm run perf -- "$RUNNER_TEMP/lighthouse"
      - name: Informes de Lighthouse
        if: always()
        # SHA de la etiqueta v7.0.2 leído en la API de GitHub (git/ref/tags/v7.0.2) el 2026-11-26.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: |
            ${{ runner.temp }}/lighthouse/summary.json
            ${{ runner.temp }}/lighthouse/mobile/*.json
            ${{ runner.temp }}/lighthouse/desktop/*.json
          if-no-files-found: warn
          retention-days: 30
