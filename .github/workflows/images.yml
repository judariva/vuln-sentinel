name: images

# Construye la imagen del producto y la publica en GHCR (PLAN §2, §14: GHCR, 0 €). La imagen se
# identifica por digest; el despliegue (`deploy.yml`) solo acepta un digest, nunca una etiqueta, y
# antes de validar comprueba la atestación de procedencia que firma este workflow (T9b).
#
# Dos jobs, para que el token OIDC (id-token) y el permiso de atestar no estén en el job que
# ejecuta el build:
#   build   construye, prueba sin red, publica por digest con el SBOM de BuildKit adjunto.
#   attest  firma con Sigstore la procedencia (SLSA) y el SBOM, y los sube junto a la imagen.
# Sin acciones de terceros para el build: solo el CLI de docker del runner, con BuildKit en un
# contenedor (`docker-container`), porque el driver `docker` por defecto no admite atestaciones
# sin el almacén de containerd (https://docs.docker.com/build/metadata/attestations/).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  # Imágenes de BuildKit fijadas por digest (leídos del registro de Docker Hub el 2026-11-26).
  # Dependabot no las actualiza (van como opción, no como FROM): se revisan a mano.
  BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
  SBOM_GENERATOR: docker/buildkit-syft-scanner:stable-1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # Actions fijadas por SHA (tag entre comentarios), como en ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Dependencias exactas y con hash desde uv.lock
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements.lock.txt

      - name: Nombre de la imagen
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: BuildKit en contenedor (admite atestaciones)
        run: |
          docker buildx create --name vs --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" --use
          docker buildx inspect --bootstrap > /dev/null

      # Primero se carga en el daemon para la prueba de humo, sin atestaciones (el almacén clásico
      # no las admite). El build que se publica reutiliza la caché del mismo builder.
      - name: Build (local, para la prueba)
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          docker buildx build --pull --load --provenance=false --sbom=false \
            -t "${IMAGE}:${GITHUB_SHA}" .

      - name: Prueba de humo (importa la API y las migraciones, sin red ni root)
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          docker run --rm --network none --entrypoint python "${IMAGE}:${GITHUB_SHA}" \
            -c "import os, vs.api.app, vs.model.migrate; assert os.getuid() != 0"

      - name: Publicar en GHCR con el SBOM de BuildKit
        id: push
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --push \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --attest "type=sbom,generator=${SBOM_GENERATOR}" \
            --provenance=mode=min \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            -t "${IMAGE}:${GITHUB_SHA}" .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build-metadata.json")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No se pudo leer el digest publicado"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Cerrar sesión en GHCR
        if: always()
        run: docker logout ghcr.io

  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Solo este job puede pedir el token OIDC y escribir atestaciones. packages: write para subir
    # las atestaciones a GHCR junto a la imagen (push-to-registry).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Extraer el SBOM (SPDX) que BuildKit adjuntó a la imagen
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{ json .SBOM }}' \
            > "$RUNNER_TEMP/sbom-raw.json"
          docker logout ghcr.io
          # Una sola plataforma: {"SPDX": ...}; varias: {"linux/amd64": {"SPDX": ...}}.
          jq 'if has("SPDX") then .SPDX else (to_entries[0].value.SPDX) end' \
            "$RUNNER_TEMP/sbom-raw.json" > "$RUNNER_TEMP/sbom.spdx.json"
          if [[ "$(jq -r '.spdxVersion // empty' "$RUNNER_TEMP/sbom.spdx.json")" != SPDX-* ]]; then
            echo "::error::La imagen no lleva un SBOM SPDX"
            exit 1
          fi

      # SHA de la etiqueta v4.2.2 comprobado con `git ls-remote` el 2026-11-26.
      - name: Atestación de procedencia (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      # attest-sbom está en desuso a favor de actions/attest, que admite `sbom-path`.
      # SHA de la etiqueta v4.2.2 comprobado con `git ls-remote` el 2026-11-26.
      - name: Atestación del SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo "- Imagen: \`${IMAGE}@${DIGEST}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Atestaciones: procedencia SLSA y SBOM SPDX, firmadas y en GHCR"
            echo
            echo "Para desplegar: workflow \`deploy\` con \`image_digest=${DIGEST}\`."
          } >> "$GITHUB_STEP_SUMMARY"
