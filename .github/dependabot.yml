# Actualizaciones semanales de dependencias (T9b). Dependabot abre PR; la CI los valida y fusiona
# Juan (regla 9 de CLAUDE.md). Las imágenes de BuildKit fijadas en images.yml van como opción de
# driver y Dependabot no las ve: se revisan a mano.
version: 2
updates:
  # Imagen base del Dockerfile (fijada por digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Acciones de los workflows (fijadas por SHA con la etiqueta en un comentario).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Portal (web/package-lock.json).
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Los tipos van con la versión de Node que ejecuta el build (node:24 en el Dockerfile y
      # engines >=24): un salto de mayor describe APIs que ese Node no tiene. Se sube con la imagen.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint admite typescript <6.1.0: con la 7, `npm ci` falla (PR #6). Se sube cuando
      # typescript-eslint la admita.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # Python (uv.lock).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
