canonicalization:
  rules:
  - 'R1 fabricante: si el producto de KEV empieza por el nombre de OTRO fabricante de KEV (catálogo completo),
    el producto pasa a ese fabricante sin el prefijo (p. ej. «Broadcom | VMware vCenter» → VMware vCenter).
    Cada reasignación se lista en `canonicalization`.'
  - R2 «X and Y», «X, Y, and Z» → un producto por parte. Una parte de una sola palabra genérica (manager,
    gateway, controller, server, client, console, director, router, conductor) hereda el prefijo de la
    primera parte si esta acaba en palabra genérica o en sigla («NetScaler ADC and Gateway» → NetScaler
    ADC, NetScaler Gateway). Una parte que solo nombra el despliegue (server, data center, cloud, on-prem)
    se descarta («Jira Server and Data Center» → Jira Server).
  - 'R3 el contenido entre paréntesis es una abreviatura del producto («Adaptive Security Appliance (ASA)»):
    se guarda aparte y no forma parte de la clave.'
  - R4 se quita el nombre del propio fabricante al principio («WordPress Core» → Core), salvo que el producto
    se llame igual que el fabricante o solo quede server/software. Un nombre que solo tiene palabras de
    edición (community, enterprise, edition(s), ce, ee) es el producto con el nombre del fabricante.
  - R5 clave = nombre normalizado sin los sufijos genéricos finales (software, device(s), series); «appliances»
    se normaliza a «appliance».
  - 'R6 producto genérico: si el producto de KEV es el nombre del fabricante y ese fabricante tiene otros
    productos en la ventana, o empieza por «Multiple», se busca al principio del nombre de la vulnerabilidad
    un producto conocido del fabricante (el más largo). Si no hay, «Multiple…» va a `needs_review` si
    casa alguna regla y a `out_of_scope` si no.'
  - 'R7 fusiones dentro de un fabricante: claves que comparten abreviatura; clave que acaba en «-<abreviatura>»
    o «-<otra clave>»; «X» y «X-server». La clave canónica es la de más entradas (a igualdad, la más corta
    y luego la alfabética).'
