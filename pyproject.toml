[project]
name = "vuln-sentinel"
version = "0.0.1"
description = "Monitor 24/7 de vulnerabilidades nuevas y peligrosas, con feed OSV firmado."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.13",
    "cryptography>=43",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pglast>=7",
    "hypothesis>=6.170.17",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: necesita PostgreSQL (VS_TEST_DATABASE_URL); sin la variable se salta",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
